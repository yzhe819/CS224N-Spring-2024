<!-- labels -->
<text x="255" y="178" font-size="26" fill="#222">Learning step</text>
<text x="415" y="320" font-size="26" fill="#222">Minimum</text>
<text x="145" y="468" font-size="26" fill="#222" text-anchor="middle">Random</text>
<text x="145" y="498" font-size="26" fill="#222" text-anchor="middle">initial value</text>
<polyline points="437,470 446,461 455,470" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="446" y="510" font-size="34" font-style="italic" fill="#222" text-anchor="middle">θ</text>
