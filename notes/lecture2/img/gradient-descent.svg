<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Gradient descent: repeated learning steps toward the minimum of the cost</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#ffffff"/>

  <!-- axes -->
  <line x1="75" y1="425" x2="75" y2="70" stroke="#555" stroke-width="6"/>
  <polygon points="75,45 56,85 94,85" fill="#555"/>
  <line x1="75" y1="425" x2="795" y2="425" stroke="#555" stroke-width="6"/>
  <polygon points="822,425 782,406 782,444" fill="#555"/>
  <text x="40" y="36" font-size="26" font-weight="bold" fill="#000">Cost</text>
  <text x="838" y="436" font-size="30" font-weight="bold" fill="#000">θ</text>

  <!-- cost curve (two half-parabolas meeting at the minimum) -->
  <path d="M127,100 Q286.5,385 446,385 Q608.0,385 770,108" fill="none" stroke="#555" stroke-width="5" stroke-linecap="round"/>

  <!-- dashed guides -->
  <line x1="145" y1="131.3" x2="145" y2="425" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="446" y1="385" x2="446" y2="425" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- learning steps -->
  <circle cx="145.0" cy="131.3" r="11" fill="#6a5cf0" stroke="#3b31b5" stroke-width="1.5"/>
  <circle cx="178.0" cy="183.8" r="11" fill="#6a5cf0" stroke="#3b31b5" stroke-width="1.5"/>
  <circle cx="217.0" cy="238.1" r="11" fill="#6a5cf0" stroke="#3b31b5" stroke-width="1.5"/>
  <circle cx="258.0" cy="286.0" r="11" fill="#6a5cf0" stroke="#3b31b5" stroke-width="1.5"/>
  <circle cx="294.0" cy="320.3" r="11" fill="#6a5cf0" stroke="#3b31b5" stroke-width="1.5"/>
  <circle cx="328.0" cy="346.0" r="11" fill="#6a5cf0" stroke="#3b31b5" stroke-width="1.5"/>
  <circle cx="358.0" cy="363.3" r="11" fill="#6a5cf0" stroke="#3b31b5" stroke-width="1.5"/>
  <circle cx="388.0" cy="375.6" r="11" fill="#6a5cf0" stroke="#3b31b5" stroke-width="1.5"/>
  <circle cx="418.0" cy="382.8" r="11" fill="#6a5cf0" stroke="#3b31b5" stroke-width="1.5"/>
  <circle cx="446" cy="385" r="13" fill="#fff200" stroke="#888" stroke-width="1.5"/>
  <path d="M156.0,131.9 Q198.3,134.4 182.6,172.7" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M189.0,183.8 Q235.5,183.7 220.9,226.8" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M228.0,237.2 Q271.0,233.4 260.9,274.4" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M268.8,283.9 Q300.0,278.0 295.7,308.4" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M304.5,317.0 Q329.0,309.3 328.3,334.0" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M338.0,341.4 Q355.1,333.7 356.8,351.4" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M367.3,357.4 Q381.6,348.4 385.2,363.9" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M396.3,368.4 Q408.1,358.2 413.5,371.7" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>
  <path d="M425.1,374.4 Q433.5,364.3 438.8,373.0" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- labels -->
  <text x="255" y="178" font-size="24" fill="#000">Learning step</text>
  <text x="415" y="320" font-size="24" fill="#000">Minimum</text>
  <text x="145" y="468" font-size="24" fill="#000" text-anchor="middle">Random</text>
  <text x="145" y="498" font-size="24" fill="#000" text-anchor="middle">initial value</text>
  <polyline points="437,470 446,461 455,470" fill="none" stroke="#000" stroke-width="2.5"/>
  <text x="446" y="510" font-size="34" fill="#000" text-anchor="middle">θ</text>
